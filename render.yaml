services:
  - type: web
    name: event-organizing-and-vendor-booking
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://infobekele.netlify.app
      - key: DB_HOST
        value: mysql-2114e6b-abebeke99-9391.g.aivencloud.com
      - key: DB_PORT
        value: 11713
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: true
      - key: DB_SSL_CA
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none

  - type: web
    name: event-platform-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://event-organizing-and-vendor-booking.onrender.com
