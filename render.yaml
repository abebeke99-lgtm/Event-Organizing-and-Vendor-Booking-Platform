services:
  - type: web
    name: event-organizing-and-vendor-booking
    runtime: node
    branch: main
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: COOKIE_SECURE
        sync: false
      - key: COOKIE_SAME_SITE
        sync: false
