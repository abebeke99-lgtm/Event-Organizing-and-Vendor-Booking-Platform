services:
  - type: web
    name: event-platform-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WEB_ORIGIN
        value: https://infobekele.netlify.app
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: true
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none

  - type: web
    name: event-platform-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
